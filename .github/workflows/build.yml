name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # для аттестации происхождения сборки
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.16"

      - name: Verify bundled upstream code is unchanged
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/verify_upstream.py

      - name: Version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = (Select-String -Path app/paths.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"
          # публикуем релиз, если это тег или в main новая версия, для которой релиза ещё нет
          $publish = 'false'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $publish = 'true' }
          elseif ($env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -ne 'pull_request') {
            gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) { $publish = 'true' }
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "Publish: $publish"
          $global:LASTEXITCODE = 0

      - name: Build single exe
        run: pyinstaller --noconfirm --distpath out/onefile --workpath build/onefile ZapretTG.spec

      - name: Build folder (portable / installer)
        env:
          ONEDIR: "1"
        run: pyinstaller --noconfirm --distpath dist --workpath build/onedir ZapretTG.spec

      - name: Check folder layout
        shell: pwsh
        run: |
          # исключения Защитника в установщике указывают ровно на эту папку
          if (-not (Test-Path dist\ZapretTG\_internal\resources\zapret\bin\winws.exe)) { throw "unexpected layout" }

      - name: Self-test (real Windows)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($exe in @('out\onefile\ZapretTG.exe', 'dist\ZapretTG\ZapretTG.exe')) {
            $log = Join-Path $env:RUNNER_TEMP ("selftest-" + [guid]::NewGuid().ToString('N') + ".txt")
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest=$log" -Wait -PassThru
            Get-Content $log
            if ($p.ExitCode -ne 0) { throw "Self-test failed for $exe (exit $($p.ExitCode))" }
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\ZapretTG.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out\onefile\ZapretTG.exe release\ZapretTG.exe
          Copy-Item dist\ZapretTG-Setup.exe release\ZapretTG-Setup.exe
          Compress-Archive -Path dist\ZapretTG\* -DestinationPath release\ZapretTG-portable.zip -CompressionLevel Optimal
          Get-ChildItem release | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt

      - name: Attest build provenance
        if: steps.ver.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/ZapretTG.exe
            release/ZapretTG-Setup.exe
            release/ZapretTG-portable.zip

      - name: VirusTotal (если задан секрет VT_API_KEY)
        id: vt
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) { "enabled=false" >> $env:GITHUB_OUTPUT; Write-Host "VT_API_KEY не задан — пропуск"; exit 0 }
          $h = @{ 'x-apikey' = $env:VT_API_KEY }
          foreach ($f in @('ZapretTG.exe', 'ZapretTG-Setup.exe', 'ZapretTG-portable.zip')) {
            $path = "release\$f"
            $url = (Invoke-RestMethod -Uri 'https://www.virustotal.com/api/v3/files/upload_url' -Headers $h).data
            curl.exe -s --fail -X POST $url -H "x-apikey: $env:VT_API_KEY" -F "file=@$path" | Out-Null
            Write-Host "VirusTotal: отправлен $f"
          }
          "enabled=true" >> $env:GITHUB_OUTPUT

      - name: Release notes
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $zv = (Select-String -Path resources\zapret\service.bat -Pattern 'LOCAL_VERSION=([^"]+)').Matches[0].Groups[1].Value
          $tv = (Select-String -Path vendor\tgws\proxy\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $py = (python --version) -replace 'Python ', ''
          $pi = (python -m PyInstaller --version)
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $commit = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
          $vt = '${{ steps.vt.outputs.enabled }}' -eq 'true'
          $rows = foreach ($f in @('ZapretTG-Setup.exe', 'ZapretTG.exe', 'ZapretTG-portable.zip')) {
            $hash = (Get-FileHash "release\$f" -Algorithm SHA256).Hash.ToLower()
            $vtl = if ($vt) { "[отчёт](https://www.virustotal.com/gui/file/$hash)" } else { "[проверить](https://www.virustotal.com/gui/file/$hash)" }
            "| $f | ``$hash`` | $vtl |"
          }
          $notes = Get-Content docs\RELEASE_NOTES.md -Raw
          $build = @"

          ## Сведения о сборке

          Собрано автоматически в GitHub Actions на чистом Windows-раннере из открытого кода — никто не собирал эти файлы вручную.

          - Коммит: [$($env:GITHUB_SHA.Substring(0,7))]($commit) · [лог сборки]($run)
          - Python $py · PyInstaller $pi · Inno Setup 6
          - Внутри без изменений: zapret-discord-youtube $zv · tg-ws-proxy $tv — сборка сверила все файлы с оригиналами побайтово ([tools/verify_upstream.py]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/main/tools/verify_upstream.py))
          - Каждая сборка прошла самопроверку на Windows (запуск, разбор всех стратегий, все страницы интерфейса)

          | Файл | SHA-256 | VirusTotal |
          |---|---|---|
          $($rows -join "`n")

          **Проверить подлинность** (что файл собран именно здесь, из этого коммита):
          ``````
          gh attestation verify ZapretTG-Setup.exe --repo $env:GITHUB_REPOSITORY
          ``````
          Хеш файла в PowerShell: ``Get-FileHash .\ZapretTG-Setup.exe``. Подробнее — [SECURITY.md]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/main/SECURITY.md).
          "@ -replace '(?m)^          ', ''
          Set-Content -Path release-notes.md -Value ($notes + $build) -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ZapretTG-${{ steps.ver.outputs.version }}
          path: release/*

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: ZapretTG ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: release/*

  scoop:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Update Scoop manifest
        run: |
          VER="${{ needs.build.outputs.version }}"
          ZIP=$(find art -name ZapretTG-portable.zip | head -1)
          HASH=$(sha256sum "$ZIP" | cut -d' ' -f1)
          python3 - "$VER" "$HASH" <<'PY'
          import json, sys
          ver, h = sys.argv[1], sys.argv[2]
          p = "bucket/zaprettg.json"
          m = json.load(open(p, encoding="utf-8"))
          m["version"] = ver
          m["url"] = f"https://github.com/tendo432/ZapretTG/releases/download/v{ver}/ZapretTG-portable.zip"
          m["hash"] = h
          json.dump(m, open(p, "w", encoding="utf-8"), indent=4, ensure_ascii=False)
          open(p, "a").write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/zaprettg.json
          git diff --cached --quiet || git commit -m "scoop: zaprettg ${VER}"
          git push
